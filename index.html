<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venturi Effect Simulator</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef4f8;
    display:flex;
    justify-content:center;
    padding:20px;
}

.container{
    width:1000px;
    display:flex;
    gap:20px;
}

.controls{
    width:250px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.controls h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
}

canvas{
    background:white;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.metric{
    margin-top:12px;
    padding:8px;
    background:#f2f6fa;
    border-radius:6px;
}
</style>

</head>
<body>

<div class="container">

<div class="controls">

<h2>Venturi Controls</h2>

<label>
Pipe Diameter (mm)
<input id="d1" type="range" min="40" max="100" value="70">
<span id="d1v">70</span>
</label>

<label>
Throat Diameter (mm)
<input id="d2" type="range" min="10" max="50" value="25">
<span id="d2v">25</span>
</label>

<label>
Inlet Velocity (m/s)
<input id="v1" type="range" min="1" max="10" value="3" step="0.5">
<span id="v1v">3.0</span>
</label>

<div class="metric">
<b>Throat Velocity</b><br>
<span id="velocity">0</span> m/s
</div>

<div class="metric">
<b>Inlet Pressure</b><br>
<span id="p1">200</span> kPa
</div>

<div class="metric">
<b>Throat Pressure</b><br>
<span id="p2">0</span> kPa
</div>

<div class="metric">
<b>Pressure Drop</b><br>
<span id="dp">0</span> kPa
</div>

</div>

<canvas id="canvas" width="700" height="500"></canvas>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const rho=1000;
const Pin=200000;

let particles=[];

function area(d){
    return Math.PI*Math.pow(d/2,2);
}

function values(){

const D1=Number(d1.value);
const D2=Number(d2.value);
const V1=Number(v1.value);

const A1=area(D1);
const A2=area(D2);

const V2=V1*A1/A2;

const P2=Pin+0.5*rho*(V1*V1-V2*V2);

return{
D1,D2,V1,V2,P2
};

}

function pipeRadius(d){
    return d*1.4;
}

function drawPipe(){

const {D1,D2}=values();

const r1=pipeRadius(D1/2);
const r2=pipeRadius(D2/2);

ctx.beginPath();

ctx.moveTo(100,250-r1);

ctx.lineTo(250,250-r1);

ctx.lineTo(350,250-r2);

ctx.lineTo(450,250-r2);

ctx.lineTo(550,250-r1);

ctx.lineTo(650,250-r1);

ctx.lineTo(650,250+r1);

ctx.lineTo(550,250+r1);

ctx.lineTo(450,250+r2);

ctx.lineTo(350,250+r2);

ctx.lineTo(250,250+r1);

ctx.lineTo(100,250+r1);

ctx.closePath();

ctx.fillStyle="#dff4ff";
ctx.fill();

ctx.lineWidth=3;
ctx.strokeStyle="#3ea5ff";
ctx.stroke();

}

function spawn(){

const {D1}=values();

const r=pipeRadius(D1/2);

particles.push({

x:110,
y:250+(Math.random()*2-1)*r

});

}

function move(){

const {V1,V2,D1,D2}=values();

const r1=pipeRadius(D1/2);
const r2=pipeRadius(D2/2);

particles.forEach(p=>{

let speed=V1*2;

if(p.x>250 && p.x<450)
speed=V2*2;

p.x+=speed;

if(p.x>700)p.dead=true;

});

particles=particles.filter(p=>!p.dead);

}

function drawParticles(){

const {D1,D2}=values();

const r1=pipeRadius(D1/2);
const r2=pipeRadius(D2/2);

particles.forEach(p=>{

ctx.beginPath();

ctx.arc(p.x,p.y,3,0,Math.PI*2);

ctx.fillStyle="#0077ff";

ctx.fill();

});

}

function updateUI(){

const {D1,D2,V1,V2,P2}=values();

d1v.textContent=D1;
d2v.textContent=D2;
v1v.textContent=V1.toFixed(1);

velocity.textContent=V2.toFixed(2);

p1.textContent=(Pin/1000).toFixed(1);

p2.textContent=(P2/1000).toFixed(1);

dp.textContent=((Pin-P2)/1000).toFixed(1);

}

function animate(){

ctx.clearRect(0,0,700,500);

drawPipe();

if(Math.random()<0.6)
spawn();

move();

drawParticles();

updateUI();

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
